# Optional: a real Postgres for local development / integration tests.
#   docker compose up -d
#   DATABASE_URL=postgres://rcms:rcms@localhost:5432/rcms npm run db:migrate && npm run db:seed
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rcms
      POSTGRES_PASSWORD: rcms
      POSTGRES_DB: rcms
    ports:
      - "5432:5432"
    volumes:
      - rcms-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcms"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  rcms-pg:
